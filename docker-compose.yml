version: '3.8'

services:
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    image: python-convert:latest
    container_name: ndn-grpc-sidecar
    ports:
      - "19090:19090"  # gRPC server port
      - "6363:6363"     # NDN/NFD port
    environment:
      - MODE=sidecar
      - GRPC_SERVER_PORT=19090
      - LOG_LEVEL=INFO
      - NDN_PIB_PATH=/root/.ndn/pib.db
      - NDN_TPM_PATH=/root/.ndn/ndnsec-key-file
      # Main container address (if needed for bridge)
      - GRPC_CLIENT_HOST=localhost:19090
    volumes:
      # Mount config file (optional, can use environment variables)
      - ./config.yaml:/app/config.yaml:ro
      # Mount host NDN PIB and TPM (read-write to allow SQLite to create temporary files)
      # Note: Application should use Keychain in read-only mode to avoid concurrent write issues
      # All containers share the same identity from host
      - /root/.ndn:/root/.ndn:rw
    networks:
      - ndn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.settimeout(5); result = s.connect_ex(('localhost', 19090)); s.close(); exit(0 if result == 0 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ndn-network:
    driver: bridge

